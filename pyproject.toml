[project]
name = "ai-market-intelligence"
version = "0.1.0"
description = "Event-centric intelligence system for AI-related Polymarket markets"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0",
    "lxml_html_clean>=0.4.0",
    "newspaper4k>=0.9.0",
    "ddgs>=7.0.0",
    "praw>=7.7.1",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "python-dateutil>=2.8.2",
    "numpy>=1.26.0",
    "regex>=2023.12.25",
]

[project.optional-dependencies]
ml = [
    "transformers>=4.37.0",
    "sentence-transformers>=2.3.1",
    "torch>=2.1.0",
]
api = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
]

[tool.poetry]
name = "ai-market-intelligence"
version = "0.1.0"
description = "Event-centric intelligence system for AI-related Polymarket markets"
authors = ["Causal Team"]
packages = [
    { include = "pipeline" },
    { include = "belief_graph" },
    { include = "integrations" },
    { include = "models" },
    { include = "api" },
    { include = "cli" },
    { include = "utils" },
    { include = "lib" },
]

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.4"
pytest-asyncio = ">=0.23.0"
black = ">=24.1.0"
isort = ">=5.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
